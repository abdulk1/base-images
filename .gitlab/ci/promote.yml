# Manual promotion: re-tag the signed candidate as the stable rolling
# tag (`:<version>` with no suffix). Applications pin to either the
# immutable `<version>-<date>-<sha>` tag (preferred) or this rolling tag.
#
# Kaniko's --no-push --tar-path then crane is one option; simpler: use
# `crane copy` from the gcr.io/go-containerregistry image.

promote:stable:
  stage: promote
  needs: ["auth:ecr", "sign:cosign"]
  image:
    name: gcr.io/go-containerregistry/crane:v0.20.2
    entrypoint: [""]
  variables:
    CANDIDATE_REF: "${ECR_REGISTRY}/${ECR_REPO_PREFIX}/${IMAGE_NAME}:${IMAGE_VERSION}-candidate"
    STABLE_REF:    "${ECR_REGISTRY}/${ECR_REPO_PREFIX}/${IMAGE_NAME}:${IMAGE_VERSION}"
    DOCKER_CONFIG: "${CI_PROJECT_DIR}/.docker"
  script:
    - crane copy "${CANDIDATE_REF}" "${STABLE_REF}"
    - echo "promoted ${STABLE_REF}"
  parallel:
    matrix:
      - IMAGE_NAME: java
        IMAGE_VERSION: "25"
      - IMAGE_NAME: python
        IMAGE_VERSION: "3.13"
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
