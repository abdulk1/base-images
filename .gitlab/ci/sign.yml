# Generate an SBOM (syft) and sign the immutable image tag with cosign
# keyless OIDC. Only runs on the default branch / tags so MR pipelines
# don't burn Fulcio/Rekor entries on throwaway candidates.

sbom:syft:
  stage: sign
  needs: ["auth:ecr", "scan:trivy"]
  image:
    name: ${SYFT_IMAGE}
    entrypoint: [""]
  variables:
    CANDIDATE_REF: "${ECR_REGISTRY}/${ECR_REPO_PREFIX}/${IMAGE_NAME}:${IMAGE_VERSION}-candidate"
    DOCKER_CONFIG: "${CI_PROJECT_DIR}/.docker"
  script:
    - syft "${CANDIDATE_REF}"
        --output "spdx-json=sbom-${IMAGE_NAME}-${IMAGE_VERSION}.spdx.json"
        --output "cyclonedx-json=sbom-${IMAGE_NAME}-${IMAGE_VERSION}.cdx.json"
  artifacts:
    paths:
      - "sbom-*.json"
    expire_in: 90 days
  parallel:
    matrix:
      - IMAGE_NAME: java
        IMAGE_VERSION: "25"
      - IMAGE_NAME: python
        IMAGE_VERSION: "3.13"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

sign:cosign:
  stage: sign
  needs: ["auth:ecr", "scan:trivy", "sbom:syft"]
  image:
    name: ${COSIGN_IMAGE}
    entrypoint: [""]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    CANDIDATE_REF: "${ECR_REGISTRY}/${ECR_REPO_PREFIX}/${IMAGE_NAME}:${IMAGE_VERSION}-candidate"
    DOCKER_CONFIG: "${CI_PROJECT_DIR}/.docker"
    COSIGN_YES: "true"
  script:
    - cosign version
    - cosign sign "${CANDIDATE_REF}"
    - cosign attest
        --predicate "sbom-${IMAGE_NAME}-${IMAGE_VERSION}.spdx.json"
        --type spdxjson
        "${CANDIDATE_REF}"
  parallel:
    matrix:
      - IMAGE_NAME: java
        IMAGE_VERSION: "25"
      - IMAGE_NAME: python
        IMAGE_VERSION: "3.13"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
